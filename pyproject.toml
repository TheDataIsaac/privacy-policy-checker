[project]
name = "privacy-policy-checker"
version = "0.1.0"
description = "An agent that checks a privacy policy for the disclosures GDPR Article 13 requires, with a checked quote for every finding."
readme = "README.md"
authors = [{ name = "Isaac Oresanya" }]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "mcp>=2.0",
    "pypdf>=5",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[project.scripts]
policy = "policy_checker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_checker"]

[tool.ruff]
line-length = 100
